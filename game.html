<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #eee;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
  }
  h1 { color: #4ade80; letter-spacing: 2px; }
  #hud {
    display: flex;
    gap: 32px;
    font-size: 1.1rem;
  }
  #hud span { color: #facc15; font-weight: bold; }
  canvas {
    background: #16213e;
    border: 3px solid #4ade80;
    border-radius: 8px;
    box-shadow: 0 0 24px rgba(74, 222, 128, .25);
    touch-action: none;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,.75);
    padding: 32px 48px;
    border-radius: 12px;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay p { font-size: 1rem; color: #aaa; }
  button {
    font-family: inherit;
    font-size: 1rem;
    background: #4ade80;
    color: #1a1a2e;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #86efac; }
  #hint { font-size: .85rem; color: #666; }
</style>
</head>
<body>
<h1>🐍 JOGO DA COBRINHA</h1>

<div id="hud">
  <div>Pontos: <span id="score">0</span></div>
  <div>Recorde: <span id="best">0</span></div>
</div>

<div style="position:relative">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <h2 id="overlayTitle">Pronto?</h2>
    <p id="overlayText">Use as setas ou WASD para mover</p>
    <button id="startBtn">Jogar</button>
  </div>
</div>

<p id="hint">Setas / WASD para mover • Espaço para pausar • 📱 deslize o dedo no tabuleiro</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const grid = 20;
const cols = canvas.width / grid;
const rows = canvas.height / grid;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');

let snake, dir, nextDir, food, score, best, speed, timer, state;
let storage;
try {
  storage = window.localStorage;
  storage.getItem('snakeBest');
} catch (err) {
  storage = {
    getItem(k) { return this.data[k] ?? null; },
    setItem(k, v) { this.data[k] = v; },
    data: {}
  };
}
best = +(storage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speed = 120;
  scoreEl.textContent = score;
  spawnFood();
}

function spawnFood() {
  do {
    food = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74, 222, 128, ${1 - i / (snake.length * 1.5)})`;
    ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
  });
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  const hitWall = head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      storage.setItem('snakeBest', best);
    }
    spawnFood();
    if (speed > 50) {
      speed -= 3;
      clearInterval(timer);
      timer = setInterval(step, speed);
    }
  } else {
    snake.pop();
  }

  draw();
}

function gameOver() {
  clearInterval(timer);
  state = 'over';
  overlayTitle.textContent = 'Game Over!';
  overlayText.textContent = `Você fez ${score} pontos 🎯`;
  startBtn.textContent = 'Jogar de novo';
  overlay.classList.remove('hidden');
}

function start() {
  reset();
  overlay.classList.add('hidden');
  state = 'playing';
  timer = setInterval(step, speed);
  draw();
}

function pause() {
  if (state === 'playing') {
    clearInterval(timer);
    state = 'paused';
    overlayTitle.textContent = 'Pausado';
    overlayText.textContent = 'Pressione espaço para continuar';
    startBtn.textContent = 'Continuar';
    overlay.classList.remove('hidden');
  } else if (state === 'paused') {
    overlay.classList.add('hidden');
    state = 'playing';
    timer = setInterval(step, speed);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const moves = {
    'arrowup': {x: 0, y: -1}, 'w': {x: 0, y: -1},
    'arrowdown': {x: 0, y: 1}, 's': {x: 0, y: 1},
    'arrowleft': {x: -1, y: 0}, 'a': {x: -1, y: 0},
    'arrowright': {x: 1, y: 0}, 'd': {x: 1, y: 0}
  };
  if (moves[k]) {
    e.preventDefault();
    const m = moves[k];
    if (m.x !== -dir.x || m.y !== -dir.y) nextDir = m;
  }
  if (k === ' ') {
    e.preventDefault();
    pause();
  }
});

startBtn.addEventListener('click', () => {
  if (state === 'paused') pause();
  else start();
});

let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchX = t.clientX;
  touchY = t.clientY;
}, {passive: true});
canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX;
  const dy = t.clientY - touchY;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  let m;
  if (Math.abs(dx) > Math.abs(dy)) m = {x: dx > 0 ? 1 : -1, y: 0};
  else m = {x: 0, y: dy > 0 ? 1 : -1};
  if (m.x !== -dir.x || m.y !== -dir.y) nextDir = m;
});

reset();
state = 'idle';
draw();
</script>
</body>
</html>
